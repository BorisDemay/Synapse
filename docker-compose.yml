name: synapse

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    image: synapse-server:${SYNAPSE_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        SYNAPSE_COMMIT_SHA: ${SYNAPSE_COMMIT_SHA:-development}
        SYNAPSE_VERSION: ${SYNAPSE_VERSION:-0.1.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_BIND_ADDR: 0.0.0.0:3000
      SYNAPSE_DATABASE_URL: postgres://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@postgres:5432/${POSTGRES_DB:-synapse}
      SYNAPSE_STORAGE_PATH: /var/lib/synapse/blobs
      SYNAPSE_ALLOWED_ORIGIN: ${SYNAPSE_ALLOWED_ORIGIN:-https://notes.example.com}
      SYNAPSE_ALLOW_PUBLIC_SIGNUP: ${SYNAPSE_ALLOW_PUBLIC_SIGNUP:-false}
      SYNAPSE_COOKIE_SECURE: ${SYNAPSE_COOKIE_SECURE:-true}
      SYNAPSE_ENV: ${SYNAPSE_ENV:-production}
      SYNAPSE_DEV_FIXTURE: ${SYNAPSE_DEV_FIXTURE:-false}
      SYNAPSE_TRUSTED_PROXIES: ${SYNAPSE_TRUSTED_PROXIES:-}
      SYNAPSE_PUBLIC_HOST: ${SYNAPSE_PUBLIC_HOST:-notes.example.com}
      SYNAPSE_LAST_BACKUP_AT: ${SYNAPSE_LAST_BACKUP_AT:-}
      SYNAPSE_BOOTSTRAP_ADMIN_EMAIL: ${SYNAPSE_BOOTSTRAP_ADMIN_EMAIL:-}
      SYNAPSE_BOOTSTRAP_ADMIN_PASSWORD: ${SYNAPSE_BOOTSTRAP_ADMIN_PASSWORD:-}
      SYNAPSE_SMTP_URL: ${SYNAPSE_SMTP_URL:-}
      SYNAPSE_MAIL_FROM: ${SYNAPSE_MAIL_FROM:-synapse@localhost}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - blob_data:/var/lib/synapse/blobs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  web:
    image: synapse-web:${SYNAPSE_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        SYNAPSE_COMMIT_SHA: ${SYNAPSE_COMMIT_SHA:-development}
        SYNAPSE_VERSION: ${SYNAPSE_VERSION:-0.1.0}
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ${SYNAPSE_RELEASES_PATH:-./infra/releases}:/usr/share/nginx/updates:ro
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    depends_on:
      - web
      - server
    environment:
      SYNAPSE_PUBLIC_HOST: ${SYNAPSE_PUBLIC_HOST:-notes.example.com}
    ports:
      # HTTP is loopback-only by default. Caddy serves the public certificate
      # on 443 when SYNAPSE_PUBLIC_HOST is configured.
      - "${SYNAPSE_HTTP_BIND:-127.0.0.1}:${SYNAPSE_HTTP_PORT:-8080}:80"
      - "${SYNAPSE_HTTPS_BIND:-0.0.0.0}:${SYNAPSE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/caddy/${SYNAPSE_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://server:3000/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional observability profile keeps the minimal path free of paid services.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  postgres_data:
  blob_data:
  caddy_data:
  caddy_config:
