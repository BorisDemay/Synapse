[profile.default]
# Only PostgreSQL-backed integration binaries share synapse_test. Serialize those
# across nextest processes; pure server tests remain parallel with the workspace.
default-filter = "all()"

[test-groups]
server-db = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(synapse-server) & (binary(account_settings) | binary(auth) | binary(csrf) | binary(health) | binary(migration_concurrency) | binary(sync_conflict) | binary(sync_limits) | binary(sync_pull) | binary(sync_push) | binary(vault_authorization) | binary(websocket))'
test-group = 'server-db'
