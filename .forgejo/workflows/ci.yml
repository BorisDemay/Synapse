name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: synapse_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SYNAPSE_DATABASE_URL: postgres://postgres@127.0.0.1:55432/synapse_test
      SYNAPSE_STORAGE_PATH: ${{ github.workspace }}/.ci-blobs
      SYNAPSE_BIND_ADDR: 127.0.0.1:3000
      SYNAPSE_ALLOWED_ORIGIN: http://127.0.0.1:5173
      SYNAPSE_ALLOW_PUBLIC_SIGNUP: "true"
      SYNAPSE_COOKIE_SECURE: "false"
      SYNAPSE_BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      SYNAPSE_BOOTSTRAP_ADMIN_PASSWORD: correct horse battery staple
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install just, nextest, cargo-deny
        run: |
          cargo install just --locked
          cargo install cargo-nextest --locked
          cargo install cargo-deny --locked

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start API for e2e
        run: |
          mkdir -p "$SYNAPSE_STORAGE_PATH"
          cargo build -p synapse-server
          ./target/debug/synapse-server > /tmp/synapse-ci-server.log 2>&1 &
          echo $! > /tmp/synapse-ci-server.pid
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready" >&2
          cat /tmp/synapse-ci-server.log >&2 || true
          exit 1

      - name: just verify
        run: just verify

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            /tmp/synapse-ci-server.log
            playwright-report/
            test-results/
          if-no-files-found: ignore

  desktop-native:
    name: desktop-native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: pnpm

      - name: Install desktop WebDriver prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y webkit2gtk-driver xvfb

      - name: Install Edge WebDriver prerequisite (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install edgedriver -y --no-progress

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Native Tauri smoke (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a pnpm --filter @synapse/desktop test:native

      - name: Native Tauri smoke (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @synapse/desktop test:native
