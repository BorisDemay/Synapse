name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-artifacts:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: pnpm

      - name: Install Linux bundle prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundle
        run: pnpm --filter @synapse/desktop tauri build

      - name: Decode Windows signing certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) { throw "Windows signing certificate is required" }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/synapse-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))

      - name: Sign Windows installers
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "Windows signing password is required" }
          $targets = Get-ChildItem target/release/bundle -Recurse -Include *.exe,*.msi
          if ($targets.Count -eq 0) { throw "No Windows installer was produced" }
          foreach ($target in $targets) { & signtool sign /fd SHA256 /f "$env:RUNNER_TEMP/synapse-signing.pfx" /p "$env:WINDOWS_CERTIFICATE_PASSWORD" $target.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; & signtool verify /pa $target.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synapse-desktop-${{ matrix.os }}-${{ github.ref_name }}
          path: target/release/bundle/
          if-no-files-found: error

  server-web-and-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install just --locked
      - run: cargo build -p synapse-server --release
      - run: pnpm --filter @synapse/web build
      - run: just sbom
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-server-web-sbom-${{ github.ref_name }}
          path: |
            target/release/synapse-server
            apps/web/dist/
            target/sbom/
          if-no-files-found: error

  attest:
    needs: [desktop-artifacts, server-web-and-sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release/
      - name: Generate and sign checksums
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          test -n "$LINUX_GPG_PRIVATE_KEY" || { echo "Linux signing key is required" >&2; exit 1; }
          test -n "$LINUX_GPG_PASSPHRASE" || { echo "Linux signing passphrase is required" >&2; exit 1; }
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          find release -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          gpg --batch --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE" --armor --detach-sign SHA256SUMS
      - name: Determine update channel
        run: |
          case "${GITHUB_REF_NAME}" in
            *-beta*) echo beta > channel ;;
            *) echo stable > channel ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-attestation-${{ github.ref_name }}
          path: |
            SHA256SUMS
            SHA256SUMS.asc
            channel
