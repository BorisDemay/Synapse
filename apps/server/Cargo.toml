[package]
name = "synapse-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5.3"
axum = "0.8.8"
base64 = "0.22.1"

rand = "0.8.5"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync"] }
# MIT/Apache-2.0 Tower middleware provides standards-compliant auth throttling.
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }

uuid = { version = "1.18.1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
