[package]
name = "synapse-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "synapse_desktop"
crate-type = ["cdylib", "lib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
synapse-core = { path = "../../../crates/synapse-core" }
synapse-crypto = { path = "../../../crates/synapse-crypto" }
synapse-local-store = { path = "../../../crates/synapse-local-store" }
synapse-protocol = { path = "../../../crates/synapse-protocol" }
synapse-sync = { path = "../../../crates/synapse-sync" }
synapse-vault-service = { path = "../../../crates/synapse-vault-service" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-updater = { version = "=2.11.0", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
url = "2.5.7"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0"
synapse-core = { path = "../../../crates/synapse-core" }
synapse-crypto = { path = "../../../crates/synapse-crypto" }
synapse-protocol = { path = "../../../crates/synapse-protocol" }
tokio = { version = "1.48.0", features = ["macros", "net", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[workspace]
