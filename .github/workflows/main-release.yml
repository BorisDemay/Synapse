name: verify-build-deploy-release

on:
  push:
    branches: [main]

concurrency:
  group: synapse-stable-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  SYNAPSE_VERSION: 0.1.${{ github.run_number }}
  SYNAPSE_COMMIT_SHA: ${{ github.sha }}

jobs:
  # The quality gates run as independent jobs so their durations overlap instead
  # of adding up. Together they cover exactly the `just verify` dependency list.
  verify-code:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SYNAPSE_DATABASE_URL: postgres://postgres@127.0.0.1:55432/synapse_test
      SYNAPSE_STORAGE_PATH: ${{ github.workspace }}/.ci-blobs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reclaim Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install native Rust verification prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: just,cargo-nextest,cargo-deny
          fallback: none
      - run: pnpm install --frozen-lockfile
      - name: Generate desktop icons before Rust checks
        run: pnpm --filter @synapse/desktop exec tauri icon src-tauri/icons/icon.svg
      - run: pnpm exec playwright install --with-deps chromium
      - run: just db
      - run: just fmt-check clippy test-rust test-native-rust test-js test-harness test-release test-security test-operations typecheck lint audit-rust audit-js

  verify-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SYNAPSE_DATABASE_URL: postgres://postgres@127.0.0.1:55432/synapse_test
      SYNAPSE_STORAGE_PATH: ${{ github.workspace }}/.ci-blobs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reclaim Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: just
          fallback: none
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: just db
      - run: just e2e-recovery

  verify-selfhosted:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reclaim Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: just
          fallback: none
      - run: just test-recovery-selfhosted

  verify-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reclaim Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: just
          fallback: none
      - run: just test-recovery-backup test-release-drill

  desktop-native:
    name: desktop-native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reclaim Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install native recovery prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xdotool dbus-x11 openbox
      - name: Install isolated PostgreSQL and matching WebView2 driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./infra/scripts/native-ci-windows.ps1 -Action start
      - name: Install cached Linux Tauri driver
        if: runner.os == 'Linux'
        run: command -v tauri-driver >/dev/null || cargo install tauri-driver --version 2.0.6 --locked
      - run: pnpm install --frozen-lockfile
      - name: Generate desktop icons
        run: pnpm --filter @synapse/desktop exec tauri icon src-tauri/icons/icon.svg
      - name: Native filesystem regression tests
        if: runner.os == 'Windows'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test local_folder
      - name: Native Tauri recovery
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a pnpm --filter @synapse/desktop test:native
      - name: Native Tauri recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            pnpm --filter @synapse/desktop test:native
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 2) { exit $LASTEXITCODE }
            Write-Warning "Native Windows recovery was transiently unsuccessful; retrying once."
          }
      - name: Stop isolated Windows PostgreSQL
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./infra/scripts/native-ci-windows.ps1 -Action stop

  desktop-bundle:
    name: desktop-bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SYNAPSE_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reclaim Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install desktop bundle prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Generate desktop icons
        run: pnpm --filter @synapse/desktop exec tauri icon src-tauri/icons/icon.svg
      - name: Validate signing credentials and configure bundler
        run: node infra/scripts/release/prepare-updater.mjs
      - run: node infra/scripts/release/set-version.mjs "$SYNAPSE_VERSION"
        shell: bash
      - name: Import Authenticode certificate before bundling
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE_PFX_BASE64 -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw "Authenticode secret missing" }
          $pfx = Join-Path $env:RUNNER_TEMP synapse.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $secure = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          if (-not $cert.HasPrivateKey) { throw "Imported Authenticode certificate has no private key" }
          # Public timestamp authorities reject self-signed test certificates, so
          # only request a timestamp when the certificate is not self-signed.
          $selfSigned = $cert.Subject -eq $cert.Issuer
          $timestampUrl = if ($selfSigned) { $null } else { "https://timestamp.digicert.com" }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe was not found in the Windows SDK" }

          # Fail fast with the real signtool diagnostics. Tauri reports a
          # non-zero signtool exit as "failed to run" and hides stderr, so a
          # probe runs before the 14-minute release build.
          $probe = Join-Path $env:RUNNER_TEMP "sign-probe"
          Set-Content -Path "$probe.rs" -Value "fn main() {}"
          & rustc "$probe.rs" -o "$probe.exe"
          if ($LASTEXITCODE -ne 0) { throw "could not build the signature probe" }
          & $signtool.FullName sign /fd sha256 /sha1 $cert.Thumbprint /d "Synapse signature probe" "$probe.exe"
          if ($LASTEXITCODE -ne 0) { throw "Authenticode probe signing failed with exit code $LASTEXITCODE" }
          if ($timestampUrl) {
            Copy-Item "$probe.exe" "$probe-timestamp.exe"
            & $signtool.FullName sign /fd sha256 /sha1 $cert.Thumbprint /d "Synapse signature probe" /tr $timestampUrl /td sha256 "$probe-timestamp.exe"
            if ($LASTEXITCODE -ne 0) { throw "Authenticode timestamp probe failed with exit code $LASTEXITCODE" }
          }

          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if (-not $config.bundle.PSObject.Properties['windows']) {
            $config.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{})
          }
          $config.bundle.windows | Add-Member -Force NoteProperty certificateThumbprint $cert.Thumbprint
          $config.bundle.windows | Add-Member -Force NoteProperty digestAlgorithm "sha256"
          if ($timestampUrl) {
            $config.bundle.windows | Add-Member -Force NoteProperty timestampUrl $timestampUrl
          } else {
            $config.bundle.windows.PSObject.Properties.Remove('timestampUrl')
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content apps/desktop/src-tauri/tauri.conf.json
          Write-Host "Authenticode thumbprint=$($cert.Thumbprint) selfSigned=$selfSigned timestampUrl=$timestampUrl"
      - name: Build signed updater bundle
        run: pnpm --filter @synapse/desktop tauri build --verbose --bundles ${{ runner.os == 'Linux' && 'appimage' || 'nsis' }}
      - name: Normalize Linux updater artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir release-desktop
          artifact="$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$artifact" && test -f "$artifact.sig"
          cp "$artifact" release-desktop/synapse-linux-x86_64.AppImage
          cp "$artifact.sig" release-desktop/synapse-linux-x86_64.AppImage.sig
      - name: Normalize Windows updater artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-desktop
          $artifact = Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -Filter '*setup.exe' | Select-Object -First 1
          if (!$artifact -or !(Test-Path "$($artifact.FullName).sig")) { throw "signed Windows updater missing" }
          $signature = Get-AuthenticodeSignature $artifact.FullName
          if ($signature.Status -eq 'NotSigned' -or !$signature.SignerCertificate) { throw "Windows Authenticode signature missing" }
          $isSelfSigned = $signature.SignerCertificate.Subject -eq $signature.SignerCertificate.Issuer
          if ($isSelfSigned) {
            if ($signature.Status -notin @('NotTrusted', 'UnknownError')) { throw "unexpected self-signed Authenticode status: $($signature.Status)" }
            Write-Warning "Self-signed Authenticode certificate detected; trust verification is skipped for this test release."
          } else {
            & signtool verify /pa $artifact.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Copy-Item $artifact.FullName release-desktop/synapse-windows-x86_64.exe
          Copy-Item "$($artifact.FullName).sig" release-desktop/synapse-windows-x86_64.exe.sig
      - name: Verify updater signatures against the public key
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            node infra/scripts/release/verify-signature.mjs release-desktop/synapse-linux-x86_64.AppImage
          else
            node infra/scripts/release/verify-signature.mjs release-desktop/synapse-windows-x86_64.exe
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ runner.os }}
          compression-level: 0
          path: release-desktop/
          if-no-files-found: error

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reclaim Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: node infra/scripts/release/set-version.mjs "$SYNAPSE_VERSION"
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: just,cargo-cyclonedx
          fallback: none
      - run: just sbom
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build cached server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          tags: synapse-server:${{ env.SYNAPSE_VERSION }}
          build-args: |
            SYNAPSE_VERSION=${{ env.SYNAPSE_VERSION }}
            SYNAPSE_COMMIT_SHA=${{ env.SYNAPSE_COMMIT_SHA }}
          outputs: type=docker,dest=synapse-server-${{ env.SYNAPSE_VERSION }}.tar
          cache-from: type=gha,scope=synapse-server
          cache-to: type=gha,scope=synapse-server,mode=min
      - name: Build cached web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: synapse-web:${{ env.SYNAPSE_VERSION }}
          build-args: |
            SYNAPSE_VERSION=${{ env.SYNAPSE_VERSION }}
            SYNAPSE_COMMIT_SHA=${{ env.SYNAPSE_COMMIT_SHA }}
          outputs: type=docker,dest=synapse-web-${{ env.SYNAPSE_VERSION }}.tar
          cache-from: type=gha,scope=synapse-web
          cache-to: type=gha,scope=synapse-web,mode=min
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-web
          compression-level: 0
          path: |
            synapse-*.tar
            target/sbom/
          if-no-files-found: error

  publish:
    needs:
      - verify-code
      - verify-e2e
      - verify-selfhosted
      - verify-recovery
      - desktop-native
      - desktop-bundle
      - images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded
          pattern: "{desktop-Linux,desktop-Windows,server-web}"
          merge-multiple: true
      - name: Verify downloaded updater signatures
        env:
          SYNAPSE_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          node infra/scripts/release/verify-signature.mjs downloaded/synapse-linux-x86_64.AppImage
          node infra/scripts/release/verify-signature.mjs downloaded/synapse-windows-x86_64.exe
      - name: Assemble and validate parity release
        env:
          SYNAPSE_RELEASE_ARTIFACTS: downloaded
          SYNAPSE_RELEASE_BASE_URL: ${{ vars.SYNAPSE_PUBLIC_URL }}
          SYNAPSE_RELEASE_OUTPUT: payload/release
          SYNAPSE_RELEASE_PUBLISHED_AT: ${{ github.event.head_commit.timestamp }}
          SYNAPSE_RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          node infra/scripts/release/generate-manifests.mjs
          node infra/scripts/release/validate-release.mjs payload/release
          cp downloaded/synapse-*.tar payload/
          find downloaded -name '*.cdx.json' -exec cp {} payload/ \;
          cp docker-compose.yml payload/
          cp infra/scripts/release/validate-release.mjs payload/
          sha256sum migrations/*.sql > payload/migrations.sha256
          (cd payload && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C payload -czf "synapse-$SYNAPSE_VERSION.tar.gz" .
          mv "synapse-$SYNAPSE_VERSION.tar.gz" payload/
      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="v$SYNAPSE_VERSION"
          # Keep the release hidden until every asset is uploaded: instances poll
          # releases/latest and must never observe a partial release.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --draft --target "$SYNAPSE_COMMIT_SHA" --title "Synapse $SYNAPSE_VERSION" --notes "$RELEASE_NOTES"
          # Asset uploads can hit transient 5xx errors; retry each one and upload
          # in parallel so a single flaky request cannot abort the release.
          upload_asset() {
            local asset="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" --clobber "$asset"; then return 0; fi
              sleep $((attempt * 5))
            done
            echo "failed to upload $asset" >&2
            return 1
          }
          export tag
          export -f upload_asset
          find payload -type f -print0 | xargs -0 -P 4 -n 1 bash -c 'upload_asset "$0"'
          gh release edit "$tag" --draft=false
