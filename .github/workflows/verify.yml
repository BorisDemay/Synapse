name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SYNAPSE_DATABASE_URL: postgres://postgres@127.0.0.1:55432/synapse_test
      SYNAPSE_STORAGE_PATH: ${{ github.workspace }}/.ci-blobs
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.1
          cache: pnpm
      - name: Install native Rust verification prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: cargo install just cargo-nextest cargo-deny --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: just db
      - run: just verify

  desktop-native:
    name: desktop-native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.17.1
          cache: pnpm
      - name: Install desktop WebDriver prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y webkit2gtk-driver xvfb
      - name: Install Edge WebDriver prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install edgedriver -y --no-progress
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - name: Native Tauri smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @synapse/desktop test:native
      - name: Native Tauri smoke
        if: runner.os == 'Windows'
        run: pnpm --filter @synapse/desktop test:native
