name: verify

on:
  pull_request:
  push:
    branches: [ci/windows-native]

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SYNAPSE_DATABASE_URL: postgres://postgres@127.0.0.1:55432/synapse_test
      SYNAPSE_STORAGE_PATH: ${{ github.workspace }}/.ci-blobs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reclaim Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          cache: pnpm
      - name: Install native Rust verification prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: just,cargo-nextest,cargo-deny
          fallback: none
      - run: pnpm install --frozen-lockfile
      - name: Generate desktop icons before Rust checks
        run: pnpm --filter @synapse/desktop exec tauri icon src-tauri/icons/icon.svg
      - run: pnpm exec playwright install --with-deps chromium
      - run: just db
      - run: just verify

  desktop-native:
    name: desktop-native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Reclaim Linux runner disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          cache: pnpm
      - name: Install desktop WebDriver prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xdotool dbus-x11 openbox
      - name: Install isolated PostgreSQL and matching WebView2 driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./infra/scripts/native-ci-windows.ps1 -Action start
      - name: Install cached Linux Tauri driver
        if: runner.os == 'Linux'
        run: command -v tauri-driver >/dev/null || cargo install tauri-driver --version 2.0.6 --locked
      - run: pnpm install --frozen-lockfile
      - name: Generate desktop icons
        run: pnpm --filter @synapse/desktop exec tauri icon src-tauri/icons/icon.svg
      - name: Native Tauri recovery
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a pnpm --filter @synapse/desktop test:native
      - name: Native Tauri recovery
        if: runner.os == 'Windows'
        run: pnpm --filter @synapse/desktop test:native
      - name: Stop isolated Windows PostgreSQL
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: ./infra/scripts/native-ci-windows.ps1 -Action stop
