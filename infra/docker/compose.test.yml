services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synapse_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${SYNAPSE_TEST_PG_PORT:-55432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./init-dev-db.sql:/docker-entrypoint-initdb.d/init-dev-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synapse_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_test_data:
